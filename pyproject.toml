[project]
name = "claude-invoice-parser"
version = "0.1.0"
description = "Extract structured data from PDF invoices with the Claude API, then check the arithmetic before anything reaches the books."
readme = "README.md"
authors = [
    { name = "rezolution-md", email = "office@rezolution.pro" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[project.scripts]
invoice-parser = "claude_invoice_parser.cli:main"
